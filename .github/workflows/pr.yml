name: PR checks

on:
  pull_request:

jobs:
  phpcs:
    uses: ./.github/workflows/phpcs.yml

  helper-tests:
    name: Helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: php tests/allowlist-gate-test.php
      - run: php tests/order-stamp-ownership-test.php
