name: Run Pressable script

on:
  push:
    branches:
      - quality
  # Re-run a deploy without a new push (Actions tab > Run workflow). Only
  # deploys from `quality`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    if: github.ref == 'refs/heads/quality'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The download URL in scripts/pressable.ts must keep its old
      # `inspry/checkview` spelling, because the installer names the plugin
      # folder after it, so it only works through GitHub's redirect to
      # CheckView/helper. Stop before any site is touched if that redirect no
      # longer lands on this repo's quality zip with the plugin inside.
      - name: Check the download URL
        run: |
          set -euo pipefail
          pattern="https://github\.com/[^'\"]+/quality\.zip"
          [ "$(grep -cE "$pattern" scripts/pressable.ts)" = 1 ] || { echo "::error::Expected exactly one quality.zip URL in scripts/pressable.ts"; exit 1; }
          url=$(grep -oE "$pattern" scripts/pressable.ts)
          result=$(curl -sSL --max-time 60 -o "$RUNNER_TEMP/quality.zip" -w '%{http_code} %{url_effective}' "$url")
          echo "$url -> $result"
          [ "$result" = "200 https://codeload.github.com/CheckView/helper/zip/refs/heads/quality" ] || { echo "::error::$url no longer resolves to the CheckView/helper quality zip"; exit 1; }
          unzip -l "$RUNNER_TEMP/quality.zip" | awk '{print $4}' | grep -E '^[^/]+/checkview\.php$' >/dev/null || { echo "::error::The quality zip has no checkview.php"; exit 1; }

      # Node 24 runs the TypeScript directly (type stripping), so nothing is
      # installed into the job that holds the deploy secrets.
      - name: Run script
        run: node scripts/pressable.ts
        env:
          PRESSABLE_CLIENT_ID: ${{secrets.PRESSABLE_CLIENT_ID}}
          PRESSABLE_CLIENT_SECRET: ${{secrets.PRESSABLE_CLIENT_SECRET}}
